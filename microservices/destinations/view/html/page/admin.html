{# ============================================================
   page/admin.html — SPA-админка гео-каталога destinations (drill-down)
   Навигация: корень → страны → регионы → места → достопримечательности.
   Данные из <script id="admin-data"> (adminData от контроллера:
   { csrf, levels, api }). Дети подгружаются через
   GET /destinations/admin/children?root=1 | ?parent=<rid>.
   Стили/JS — бандлы destinations_admin (layout при admin_page=true).
   ============================================================ #}

<div id="adm" class="adm">
  {# ---------- Шапка: заголовок + breadcrumb ---------- #}
  <div class="adm-head">
    <div>
      <h1 class="adm-title">Направления — управление</h1>
      <p class="adm-sub">Страны / регионы / места / достопримечательности</p>
    </div>
    <a class="adm-link" href="/destinations/" target="_blank">Открыть сайт ↗</a>
  </div>

  {# ---------- Хлебные крошки навигации ---------- #}
  <nav class="adm-crumbs" id="adm-crumbs" aria-label="breadcrumb">
    <a class="adm-crumb" data-go="root" href="#">Куда поехать</a>
  </nav>

  <div class="adm-layout">
    {# ---------- Левая колонка: список детей текущего узла ---------- #}
    <div class="adm-col adm-col-list">
      <div class="adm-panel">
        <div class="adm-panel-head">
          <span class="adm-panel-title" id="adm-list-title">Направления</span>
          <button class="adm-btn adm-btn-primary" id="adm-add">+ Добавить</button>
        </div>
        <div class="adm-search" id="adm-search-wrap">
          <input type="text" id="adm-search" placeholder="Поиск по названию…" />
        </div>
        <div class="adm-list" id="adm-list">
          <div class="adm-empty">Загрузка…</div>
        </div>
      </div>
    </div>

    {# ---------- Правая колонка: форма создания/редактирования ---------- #}
    <div class="adm-col adm-col-form">
      <div class="adm-panel">
        <div class="adm-panel-head">
          <span id="adm-form-title">Новый узел</span>
        </div>
        {# Индикатор/кнопка публикации текущего редактируемого узла (показывается только в режиме правки) #}
        <div class="adm-pubwrap" id="adm-pub-wrap" style="display:none">
          <span class="adm-pub-label" id="adm-pub-label">Черновик</span>
          <button class="adm-btn adm-btn-mini" id="adm-pub-toggle" type="button">Опубликовать</button>
        </div>
        <div class="adm-form" id="adm-form">
          <input type="hidden" id="f-rid" />
          <input type="hidden" id="f-current-rid" />
          <input type="hidden" id="f-current-level" />
          <div class="adm-grid2">
            <label>Название (title)<input id="f-title" placeholder="Горный Алтай" /></label>
            <label>Slug (url-сегмент)<input id="f-slug" placeholder="gornyj-altaj" /></label>
          </div>
          <div class="adm-grid2">
            <label>H1 (если отличен)<input id="f-h1" placeholder="—" /></label>
            <label>Уровень <span class="adm-level-lock" id="f-level-display"></span>
              <select id="f-level">
                <option value="country">country (страна)</option>
                <option value="region">region (регион)</option>
                <option value="place">place (место)</option>
                <option value="attraction">attraction (достопримечательность)</option>
              </select>
            </label>
          </div>
          <div class="adm-grid2">
            <label>Родитель
              <select id="f-parent"><option value="">— корень —</option></select>
            </label>
            <label>Приоритет (sitemap)
              <input id="f-priority" type="number" step="0.1" min="0" max="1" placeholder="0.5" />
            </label>
          </div>
          <div class="adm-grid2">
            <label>lat<input id="f-lat" type="number" step="0.0001" placeholder="55.75" /></label>
            <label>lng<input id="f-lng" type="number" step="0.0001" placeholder="37.62" /></label>
          </div>
          <label>Описание (SEO description)
            <textarea id="f-description" rows="2"></textarea>
          </label>
          <label>Изображение (URL)
            <input id="f-image" placeholder="https://…" />
          </label>
          <label>Контент
            <textarea id="f-content" rows="6"></textarea>
          </label>
          <div class="adm-row">
            <label class="adm-check"><input type="checkbox" id="f-is_hub" checked /> это хаб (показывать топ-места)</label>
          </div>
          <div id="adm-msg" class="adm-msg"></div>
          <div class="adm-form-actions">
            <button class="adm-btn adm-btn-primary" id="adm-save">Создать</button>
            <button class="adm-btn" id="adm-cancel">Отмена</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="application/json" id="admin-data">{{ adminData | safe }}</script>
